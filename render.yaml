# Infrastructure Render — plateforme SEPIA
# Déploiement : Render > New > Blueprint > sélectionner ce dépôt.
services:
  - type: web
    name: sepia-erp
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/sante
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"      # relever au dernier correctif 3.12.x à chaque revue
      # Active les garde-fous bloquants : cookie Secure, HSTS, messages d'erreur
      # non détaillés, origines restreintes, refus de démarrer sans secret.
      - key: SEPIA_ENV
        value: production
      - key: SEPIA_SECRET_KEY
        generateValue: true  # jamais de valeur en clair dans le dépôt
      - key: SEPIA_ADMIN_EMAIL
        value: admin@sepia.org
      # Laissé vide volontairement : si non renseigné, la plateforme engendre au
      # premier démarrage un mot de passe aléatoire inscrit une seule fois dans
      # les journaux, et impose son changement à la première connexion.
      - key: SEPIA_ADMIN_PASSWORD
        sync: false          # à renseigner dans le tableau de bord Render
      # Reprise de la main sur le compte d'administration en cas de mot de passe
      # perdu, de compte verrouillé ou désactivé. Mettre "1", redéployer, relever
      # le mot de passe dans les journaux, puis RETIRER la variable : tant qu'elle
      # est présente, chaque redémarrage réinitialise le compte.
      - key: SEPIA_ADMIN_RESET
        sync: false
      # Origines autorisées pour les appels d'API entre domaines. Vide = aucune
      # origine tierce ; l'interface servie par le même domaine reste fonctionnelle.
      - key: SEPIA_CORS_ORIGINS
        sync: false
      - key: SEPIA_SEED_DEMO
        value: "1"           # mettre "0" pour un déploiement sans projets de démonstration
      - key: DATABASE_URL
        fromDatabase:
          name: sepia-db
          property: connectionString

databases:
  - name: sepia-db
    plan: free
    region: frankfurt
    databaseName: sepia
    user: sepia
